name: Publish Marketplace

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marketplace-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm test

      - name: Build monotone catalogue snapshot
        run: |
          sequence=$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))
          npm run build -- --sequence "$sequence"

      - name: Write signing key
        run: |
          if [ -z "$BAKINGRL_MARKETPLACE_SIGNING_KEY_JSON" ]; then
            echo "Missing BAKINGRL_MARKETPLACE_SIGNING_KEY_JSON" >&2
            exit 1
          fi
          export BAKINGRL_MARKETPLACE_SIGNING_KEY="$RUNNER_TEMP/bakingrl-marketplace-signing-key.json"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";

            const source = JSON.parse(process.env.BAKINGRL_MARKETPLACE_SIGNING_KEY_JSON);
            const key = source.schema
              ? source
              : {
                  schema: "bakingrl.marketplace-signing-key/1",
                  keyId: "marketplace-root-1",
                  algorithm: source.algorithm,
                  publicKey: source.publicKey,
                  privateKeyPem: source.privateKeyPem,
                };

            writeFileSync(
              process.env.BAKINGRL_MARKETPLACE_SIGNING_KEY,
              JSON.stringify(key),
              { mode: 0o600 },
            );
          '
          echo "BAKINGRL_MARKETPLACE_SIGNING_KEY=$BAKINGRL_MARKETPLACE_SIGNING_KEY" >> "$GITHUB_ENV"
        env:
          BAKINGRL_MARKETPLACE_SIGNING_KEY_JSON: ${{ secrets.BAKINGRL_MARKETPLACE_SIGNING_KEY_JSON }}

      - run: npm run sign -- --key "$BAKINGRL_MARKETPLACE_SIGNING_KEY"

      - run: npm run verify -- --key "$BAKINGRL_MARKETPLACE_SIGNING_KEY"

      - name: Remove signing key
        if: always()
        run: |
          if [ -n "$BAKINGRL_MARKETPLACE_SIGNING_KEY" ]; then
            rm -f "$BAKINGRL_MARKETPLACE_SIGNING_KEY"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
