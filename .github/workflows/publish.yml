name: Publish Marketplace

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marketplace-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm test

      - name: Build monotone catalogue snapshot
        run: |
          sequence=$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))
          npm run build -- --sequence "$sequence"

      - name: Write signing key
        run: |
          if [ -z "$BAKINGRL_MARKETPLACE_SIGNING_KEY_JSON" ]; then
            echo "Missing BAKINGRL_MARKETPLACE_SIGNING_KEY_JSON" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/bakingrl-marketplace-signing-key.json"
          printf '%s' "$BAKINGRL_MARKETPLACE_SIGNING_KEY_JSON" > "$key_path"
          echo "BAKINGRL_MARKETPLACE_SIGNING_KEY=$key_path" >> "$GITHUB_ENV"
        env:
          BAKINGRL_MARKETPLACE_SIGNING_KEY_JSON: ${{ secrets.BAKINGRL_MARKETPLACE_SIGNING_KEY_JSON }}

      - run: npm run sign -- --key "$BAKINGRL_MARKETPLACE_SIGNING_KEY"

      - run: npm run verify -- --key "$BAKINGRL_MARKETPLACE_SIGNING_KEY"

      - name: Remove signing key
        if: always()
        run: |
          if [ -n "$BAKINGRL_MARKETPLACE_SIGNING_KEY" ]; then
            rm -f "$BAKINGRL_MARKETPLACE_SIGNING_KEY"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
